name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (must match source version and checked commit)
        required: false
        type: string
      publish_release:
        description: Publish a new release and Docker tags after all checks pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize publishing runs without cancelling an in-progress publication.
concurrency:
  group: kube-saver-ci-${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  # ── Fast feedback: lint + unit tests on every supported Python version ─
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src scripts/verify_release.py scripts/verify_image_metadata.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest tests -q

  # ── Build sdist + wheel and upload as artifacts ────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  # ── Smoke-test the built wheel in a fresh venv ─────────────────────────
  smoke-wheel:
    name: "Wheel smoke test (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Create fresh venv & install wheel
        run: |
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl

      - name: Verify CLI on PATH
        run: |
          source /tmp/smoke-venv/bin/activate
          command -v kube-saver

      - name: Verify version
        run: |
          source /tmp/smoke-venv/bin/activate
          out="$(kube-saver version)"
          echo "$out"
          echo "$out" | grep -q "kube-saver"

      - name: Verify --help lists all subcommands
        run: |
          source /tmp/smoke-venv/bin/activate
          help="$(kube-saver --help)"
          for cmd in report pr-plan notify serve doctor; do
            echo "$help" | grep -q "$cmd" || { echo "missing subcommand: $cmd"; exit 1; }
          done

      - name: Verify subcommand --help
        run: |
          source /tmp/smoke-venv/bin/activate
          kube-saver report --help
          kube-saver notify --help
          kube-saver serve --help
          kube-saver doctor --help

      - name: Verify doctor fails gracefully without kubeconfig
        run: |
          source /tmp/smoke-venv/bin/activate
          # No cluster → doctor must exit non-zero but NOT crash.
          kube-saver doctor 2>&1 | grep -q "kubeconfig" || { echo "doctor did not mention kubeconfig"; exit 1; }
          # Explicitly check non-zero exit.
          kube-saver doctor && exit 1 || echo "doctor exited non-zero as expected (OK)"

  # ── Smoke-test the Docker image against a kind cluster ──────────────────
  smoke-docker:
    name: "Docker smoke test (kind + report)"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: kind create cluster --name kube-saver-smoke --wait 60s

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Record actual image build metadata
        id: image-metadata
        run: |
          python -c "from pathlib import Path; from scripts.verify_release import source_version; print('version=' + source_version(Path('src/kube_saver/version.py').read_text()))" >> "$GITHUB_OUTPUT"
          date -u '+created=%Y-%m-%dT%H:%M:%SZ' >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: kube-saver:smoke
          load: true
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/pooyanazad/kube-saver/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.image-metadata.outputs.created }}
            org.opencontainers.image.description=Kubernetes cost estimates and resource right-sizing with local reports and review plans.
            org.opencontainers.image.documentation=https://pooyanazad.github.io/kube-saver/
            org.opencontainers.image.source=https://github.com/pooyanazad/kube-saver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-metadata.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify labels on the tested image
        env:
          IMAGE_VERSION: ${{ steps.image-metadata.outputs.version }}
        run: |
          docker image inspect kube-saver:smoke --format '{{json .Config.Labels}}' > smoke-image-labels.json
          python -m scripts.verify_image_metadata smoke-image-labels.json --version "$IMAGE_VERSION" --revision "$GITHUB_SHA"

      - name: Run version in container
        run: docker run --rm kube-saver:smoke version

      - name: Generate report via Docker against kind
        run: |
          mkdir -p smoke-out
          # Use --network host so the container can reach the kind API server
          # (whose kubeconfig points at 127.0.0.1:<random port> on the host).
          # --user overrides the in-image user; mount kubeconfig to
          # /tmp/kubeconfig and pass KUBECONFIG explicitly because that
          # override also resets HOME=/, breaking ~/.kube/config discovery.
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -e KUBECONFIG=/tmp/kubeconfig \
            -v "$HOME/.kube/config:/tmp/kubeconfig:ro" \
            -v "$PWD/smoke-out:/out" \
            kube-saver:smoke report -o /out/report.html

      - name: Verify report is non-trivial
        run: |
          bytes="$(wc -c < smoke-out/report.html)"
          echo "Report size: $bytes bytes"
          if [ "$bytes" -le 1024 ]; then
            echo "::error::Report suspiciously small ($bytes bytes)"
            exit 1
          fi
          head -c 200 smoke-out/report.html

      - name: Run doctor in container
        run: |
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -e KUBECONFIG=/tmp/kubeconfig \
            -v "$HOME/.kube/config:/tmp/kubeconfig:ro" \
            kube-saver:smoke doctor

      - name: Export the tested Docker image
        run: docker save kube-saver:smoke | gzip > smoke-image.tar.gz

      - name: Upload tested image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-image
          path: smoke-image.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-docker
          path: smoke-out/

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name kube-saver-smoke || true

  # Validate artifacts on every run; only an explicit main dispatch publishes.
  release-check:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Verify source, artifacts, CLI, and requested tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: bash
        run: |
          args=()
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          python scripts/verify_release.py --require-checksums "${args[@]}"
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            bash scripts/verify_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          fi

  # GitHub Release: opt-in dispatch, verified existing tag, no historical updates.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [release-check, smoke-wheel, smoke-docker]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Revalidate downloaded artifacts and remote tag before publishing
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -m pip install dist/*.whl
          python scripts/verify_release.py --require-checksums --tag "$RELEASE_TAG"
          bash scripts/verify_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          prev_tag=$(git tag --sort=-version:refname | grep '^v' | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
          {
            echo "## kube-saver ${RELEASE_TAG}"
            echo
            echo "Kubernetes CPU and memory cost estimation with local reports and resource-change plans."
            echo
            echo "### Included in this release"
            echo "- Interactive TUI for Kubernetes cost and waste visibility"
            echo "- Self-contained HTML report generation"
            echo "- Local notification and PR-plan output"
            echo "- Read-only HTTP API endpoints"
            echo "- Docker Hub publication follows successful GitHub release creation"
            echo
            echo "### Build artifacts"
            echo "- Python wheel and source distribution attached to this release"
            echo "- SHA256 checksums included"
            echo
            echo "### Changes in this release"
            if [[ -n "$prev_tag" ]]; then
              git log --no-merges --pretty='- %s (%h)' "$prev_tag..HEAD"
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${RELEASE_TAG}"
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
          } > release_notes.md

      - name: Create new GitHub Release (fail if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file release_notes.md

  # Publish Docker only after a new GitHub release was successfully created.
  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [release, release-check, smoke-wheel, smoke-docker]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recheck remote tag before Docker publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/verify_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smoke-image
          path: tested-image

      - name: Load the exact image that passed kind smoke checks
        run: gzip -dc tested-image/smoke-image.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the tested image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag kube-saver:smoke "$DOCKERHUB_USERNAME/kube-saver:$RELEASE_TAG"
          docker tag kube-saver:smoke "$DOCKERHUB_USERNAME/kube-saver:latest"
          docker push "$DOCKERHUB_USERNAME/kube-saver:$RELEASE_TAG"
          docker push "$DOCKERHUB_USERNAME/kube-saver:latest"
