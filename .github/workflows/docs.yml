name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs_site.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs_site.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      publish_docs:
        description: Publish documentation to GitHub Pages after owner approval
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: kube-saver-docs-${{ (github.event_name == 'workflow_dispatch' && inputs.publish_docs) && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install documentation tooling
        run: python -m pip install -r requirements-docs.txt
      - name: Strict build
        run: python -m mkdocs build --strict
      - name: Validate generated site
        run: python scripts/validate_docs_site.py site
      - name: Upload preview for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-preview
          path: site/
          retention-days: 7
      - name: Package approved Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.publish_docs && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

  deploy:
    name: Publish approved documentation
    if: github.event_name == 'workflow_dispatch' && inputs.publish_docs && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
