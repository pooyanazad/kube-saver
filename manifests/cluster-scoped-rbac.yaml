# Cluster-scoped RBAC for kube-saver
#
# Apply with: kubectl apply -f cluster-scoped-rbac.yaml
#
# This gives kube-saver read-only access to the entire cluster.

---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-saver
  labels:
    app.kubernetes.io/name: kube-saver

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-saver
  namespace: kube-saver
  labels:
    app.kubernetes.io/name: kube-saver

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-saver-reader
  labels:
    app.kubernetes.io/name: kube-saver
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["list", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["list", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-saver-reader
  labels:
    app.kubernetes.io/name: kube-saver
subjects:
  - kind: ServiceAccount
    name: kube-saver
    namespace: kube-saver
roleRef:
  kind: ClusterRole
  name: kube-saver-reader
  apiGroup: rbac.authorization.k8s.io